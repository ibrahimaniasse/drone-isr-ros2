# ROS ↔ Gazebo Harmonic bridge configuration
# Drone ISR — Phase 1
# Syntaxe: gz.msgs.* (jamais ignition.*)

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /camera/image_raw
  gz_topic_name: /world/surveillance_zone/model/isr_drone/link/camera_link/sensor/camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /camera/camera_info
  gz_topic_name: /world/surveillance_zone/model/isr_drone/link/camera_link/sensor/camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /imu
  gz_topic_name: /world/surveillance_zone/model/isr_drone/link/imu_link/sensor/imu/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name: /model/isr_drone/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /odom
  gz_topic_name: /model/isr_drone/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# TF dynamique — OdometryPublisher publie odom → base_link via ce topic
# Note: le bridge Pose_V → TFMessage fonctionne partiellement sur Jazzy/Harmonic
# (passe l'odom TF mais pas les poses statiques du PosePublisher)
- ros_topic_name: /tf
  gz_topic_name: /model/isr_drone/pose
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# NOTE: TFs statiques (base_link → camera_link/imu_link/arm_*)
# publiés directement par le node tf_static_republisher (pas via bridge)
