name: ROS2 Portfolio CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install flake8 black isort
      - name: Run isort
        run: isort --check-only --diff src/drone_isr/drone_isr/
      - name: Run black
        run: black --check --line-length 100 src/drone_isr/drone_isr/
      - name: Run flake8
        run: flake8 src/drone_isr/drone_isr/ --max-line-length=100

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy opencv-python-headless
      - name: Run Pytest
        run: pytest src/drone_isr/test/ --tb=short -v

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t drone-isr-ros2:test .
