version: '3.8'

services:
  drone-isr:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    image: drone-isr-ros2:humble
    container_name: drone-isr-container
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    network_mode: host
    command: /bin/bash -c "source /opt/ros/humble/setup.bash && source install/setup.bash && ros2 launch drone_isr perception.launch.py"
